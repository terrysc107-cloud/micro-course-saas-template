<!doctype html>
<meta charset="utf-8">
<!--
  SOCIAL POST TEMPLATE — My AI Board

  Rendered to PNG by social/render.mjs via Playwright. Deliberately not an image
  model: these are typographic cards, and a text-heavy image generated by a
  diffusion model comes back with mangled letterforms. This costs nothing per
  render and the text is always correct.

  Placeholders are replaced by the render script:
    {{KICKER}} {{HEADLINE}} {{BODY}} {{FOOTER}} {{SIZE}}
-->
<style>
  @page { margin: 0 }
  * { margin: 0; padding: 0; box-sizing: border-box }
  body {
    width: var(--w); height: var(--h);
    background: #fdfbf7;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #23201b;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 84px 76px;
    position: relative; overflow: hidden;
  }
  /* A single warm wash, not a mesh gradient. */
  body::after {
    content: ""; position: absolute; right: -180px; top: -180px;
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,.22), transparent 68%);
    pointer-events: none;
  }
  .stack {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
  }
  .kicker {
    font-size: 22px; letter-spacing: .28em; text-transform: uppercase;
    color: #8a6a1e; font-weight: 600;
  }
  h1 {
    font-size: var(--headline); line-height: 1.06; letter-spacing: -.03em;
    font-weight: 650; max-width: 20ch; margin-top: 40px;
  }
  .body {
    font-size: 34px; line-height: 1.42; color: #6b6055;
    max-width: 32ch; margin-top: 36px;
  }
  .foot {
    display: flex; align-items: center; gap: 18px;
    font-size: 24px; color: #6f6355;
  }
  .foot svg { width: 46px; height: 46px; display: block }
  .rule { flex: 1; height: 1px; background: #e7e0d2 }
</style>
<body style="--w:{{W}}px; --h:{{H}}px; --headline:{{HEADLINE_SIZE}}px">
  <div class="stack">
    <div class="kicker">{{KICKER}}</div>
    <h1>{{HEADLINE}}</h1>
    <div class="body">{{BODY}}</div>
  </div>
  <div class="foot">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="#23201b"/>
      <g fill="#c9a84c">
        <rect x="14" y="14" width="16" height="16" rx="4"/>
        <rect x="34" y="14" width="16" height="16" rx="4"/>
        <rect x="14" y="34" width="16" height="16" rx="4"/>
      </g>
      <rect x="35.5" y="35.5" width="13" height="13" rx="3" fill="none" stroke="#c9a84c" stroke-width="3" opacity=".55"/>
    </svg>
    <span>{{FOOTER}}</span>
    <span class="rule"></span>
    <span>runyouraiboard.com</span>
  </div>
</body>
